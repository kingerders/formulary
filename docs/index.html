<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulary+ — Scientific Formula Reference</title>
  <meta name="description" content="Formulary is a beautifully designed iOS app for students and engineers — thousands of scientific formulas across Mathematics, Physics, Chemistry, and Engineering.">
  <style>
    :root {
      --bg: #0f1117;
      --card: #1c1e26;
      --text: #e8eaf6;
      --muted: #9ea7c4;
      --accent: #7c9fd4;
      --border: #2e3250;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon { font-size: 80px; margin-bottom: 20px; }
    h1 { font-size: 36px; font-weight: 700; color: var(--accent); margin-bottom: 12px; }
    p { font-size: 16px; color: var(--muted); max-width: 480px; line-height: 1.7; margin-bottom: 32px; }
    .links a {
      display: inline-block;
      margin: 8px;
      padding: 10px 24px;
      border: 1px solid var(--border);
      border-radius: 24px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      transition: border-color .2s, color .2s;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }
    .links a.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    footer { margin-top: 60px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="icon">📐</div>
  <h1>Formulary+</h1>
  <p>A beautifully designed scientific formula reference for iOS — covering Mathematics, Physics, Chemistry, and Engineering.</p>
  <div class="links">
    <a class="primary" href="https://apps.apple.com/us/app/formulary/id6759667177" target="_blank">Download on the App Store</a>
    <a href="/formulary/privacy">Privacy Policy</a>
  </div>
  <footer>Formulary+ &copy; 2026 kingerders</footer>
</body>
</html>
